<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        nav {
            text-align: center;
            padding: 20px 0;
            background-color: #f8f8f8;
        }
        #nav-links a {
            margin: 0 10px;
            text-decoration: none;
            color: inherit;
        }
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            background-color: #f8f8f8;
            font-size: 14px;
        }
        .social-links a {
            margin: 0 5px;
            text-decoration: none;
            color: inherit;
        }
        .hamburger {
            position: absolute;
            top: 15px;
            right: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            nav {
                padding: 10px 0;
            }
            #nav-links {
                display: none;
                flex-direction: column;
                margin-top: 10px;
            }
            #nav-links a {
                margin: 10px 0;
                font-size: 16px;
            }
            .hamburger {
                display: block;
                cursor: pointer;
                margin-top: 10px;
            }
            .hamburger div {
                width: 30px;
                height: 3px;
                background-color: #333;
                margin: 6px 0;
                transition: 0.4s;
            }
            .hamburger.toggle div:nth-child(1) {
                transform: rotate(-45deg) translate(-5px, 6px);
            }
            .hamburger.toggle div:nth-child(2) {
                opacity: 0;
            }
            .hamburger.toggle div:nth-child(3) {
                transform: rotate(45deg) translate(-5px, -6px);
            }
            .toggle-active {
                display: flex;
            }
            footer {
                font-size: 12px;
                padding: 15px 0;
            }
            .social-links a {
                font-size: 12px;
                margin: 0 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Hamburger for Mobile -->
    <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Navigation -->
<nav>
    <div class="nav-container">
        <a href="/"><i class="fas fa-home"></i> Home</a>
        <div id="nav-links" style="margin-top: 10px;">
            <a href="/about"><i class="fas fa-user"></i> About</a>
            <a href="/projects"><i class="fas fa-project-diagram"></i> Projects</a>
            <a href="/blog"><i class="fas fa-pen"></i> Blog</a>
            <a href="/testimonials"><i class="fas fa-comments"></i> Testimonials</a>
            <a href="/contact"><i class="fas fa-envelope"></i> Contact</a>
            <a href="/skills"><i class="fas fa-lightbulb"></i> Skills</a>
            <a href="/certifications"><i class="fas fa-certificate"></i> Certifications</a>
        </div>
    </div>
</nav>


    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Anthony Sergo. All rights reserved.</p>
        <div class="social-links">
            <a href="https://x.com/SergoAnthony?t=fb0U21HU3rCoCSDkVFt4Hw&s=09" target="_blank">Twitter</a> |
            <a href="https://www.instagram.com/tonynickbush?igsh=cGI0NnZyYnk2bXI4" target="_blank">Instagram</a> |
            <a href="https://www.linkedin.com/in/anthony-sergo1" target="_blank">LinkedIn</a> |
            <a href="https://github.com/Tony-Magabush28" target="_blank">GitHub</a>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('nav-links');
            const hamburger = document.querySelector('.hamburger');
            navLinks.classList.toggle('toggle-active');
            hamburger.classList.toggle('toggle');
            document.body.classList.toggle('menu-open');
        }
    </script>

</body>
</html>
